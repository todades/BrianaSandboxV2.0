<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070d1b" />
    <title>BRIANA · Repositorio Académico</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #e2e8f0; background: radial-gradient(ellipse at 50% 0%, rgba(37,99,235,.24), transparent 55%), #070d1b; }
      main { width: min(100%, 440px); padding: 36px; text-align: center; background: #0d1629; border: 1px solid #1e2a4a; border-radius: 20px; box-shadow: 0 24px 80px rgba(0,0,0,.4); }
      .logo { width: 64px; height: 64px; display: grid; place-items: center; margin: 0 auto 18px; border-radius: 18px; background: linear-gradient(135deg,#2563eb,#22d3ee); color: white; font-size: 32px; font-weight: 900; box-shadow: 0 0 35px rgba(56,189,248,.32); }
      h1 { margin: 0; color: #fff; letter-spacing: .24em; font-size: 28px; }
      .sub { margin: 7px 0 24px; color: #38bdf8; font-size: 10px; text-transform: uppercase; letter-spacing: .24em; }
      p { color: #94a3b8; font-size: 14px; line-height: 1.65; }
      a { display: inline-flex; align-items: center; justify-content: center; margin-top: 14px; min-height: 44px; padding: 0 22px; color: #fff; text-decoration: none; font-size: 13px; font-weight: 700; border-radius: 12px; background: linear-gradient(90deg,#2563eb,#22d3ee); box-shadow: 0 0 24px rgba(56,189,248,.25); }
      .hint { margin-top: 22px; font-size: 11px; color: #64748b; }
    </style>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var link = document.getElementById("open-app");
        var message = document.getElementById("message");
        if (window.location.protocol === "file:") {
          message.textContent = "El archivo index.html necesita el servidor de BRIANA para usar el inicio de sesión, la base de datos y los servicios de correo. Inicia el proyecto con npm run dev o abre la URL desplegada.";
          link.href = "http://localhost:3000/";
          link.textContent = "Abrir BRIANA localmente";
          return;
        }
        link.href = new URL("./", window.location.href).href;
        window.location.replace(link.href);
      });
    </script>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">B</div>
      <h1>BRIANA</h1>
      <div class="sub">Repositorio Académico · IA</div>
      <p id="message">Abriendo la aplicación BRIANA…</p>
      <a id="open-app" href="/">Abrir BRIANA</a>
      <div class="hint">Sistema Institucional · PNF Informática</div>
    </main>
  </body>
</html>
