# ======================================================================
# BRIANA · Blueprint de despliegue en Render (Web Service Node.js)
# Base de datos: Neon PostgreSQL (DATABASE_URL con ?sslmode=require)
# ======================================================================
services:
  - type: web
    name: briana
    runtime: node
    plan: free
    region: oregon
    # Sincroniza el esquema con Neon y construye la app en cada despliegue.
    buildCommand: npm install && npx drizzle-kit push --force && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      # ---- Base de datos (Neon) ----
      - key: DATABASE_URL
        sync: false # pega aquí la cadena de conexión de Neon
      - key: DATABASE_SSL
        value: "true"
      # ---- Seguridad ----
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_DAYS
        value: "7"
      # ---- Administrador único ----
      - key: ADMIN_EMAIL
        value: administrador@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: administrador
      # ---- Correo SMTP (nodemailer) ----
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "465"
      - key: EMAIL_SECURE
        value: "true"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false # Contraseña de aplicación de Gmail
      - key: EMAIL_FROM
        sync: false # Ej: "BRIANA Repositorio <correo@gmail.com>"
      - key: CODE_TTL_MINUTES
        value: "15"
      - key: RESEND_COOLDOWN_SECONDS
        value: "60"
      # ---- IA ----
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
