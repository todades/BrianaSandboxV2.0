# BRIANA · Render + Neon PostgreSQL
# El backend está integrado en Next.js (src/app/api). No usar Express ni src/server.js.
services:
  - type: web
    name: briana
    runtime: node
    plan: free
    region: oregon
    # El esquema se aplica solo al arrancar (scripts/migrate-production.cjs).
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_DAYS
        value: "7"
      - key: ADMIN_EMAIL
        value: administrador@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: administrador
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "465"
      - key: EMAIL_SECURE
        value: "true"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CODE_TTL_MINUTES
        value: "15"
      - key: RESEND_COOLDOWN_SECONDS
        value: "60"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
